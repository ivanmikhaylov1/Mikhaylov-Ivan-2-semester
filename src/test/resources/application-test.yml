spring:
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: true
    properties:
      hibernate:
        format_sql: true
    generate-ddl: true
    open-in-view: false
  main:
    allow-bean-definition-overriding: true
    allow-circular-references: true
  flyway:
    enabled: false
  cloud:
    compatibility-verifier:
      enabled: false

server:
  port: 8081

logging:
  level:
    org.springframework.web: DEBUG
    org.hibernate.SQL: DEBUG
